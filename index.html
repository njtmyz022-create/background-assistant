<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Background Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;height:100dvh}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}
header b{font-size:17px}button{font:inherit;cursor:pointer}
#gear{background:none;border:0;color:#94a3b8;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.45;word-break:break-word}
.u{align-self:flex-end;background:#2563eb}.a{align-self:flex-start;background:#1e293b}
.s{align-self:flex-start;color:#94a3b8;font-size:13px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #1e293b}
textarea{flex:1;resize:none;background:#1e293b;color:#e2e8f0;border:0;border-radius:12px;padding:12px;font:inherit;max-height:120px}
form button{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:0 18px}
dialog{background:#1e293b;color:#e2e8f0;border:0;border-radius:16px;padding:20px;width:min(92vw,420px)}
dialog input{width:100%;margin:6px 0 14px;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}
dialog label{font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<header><b>Background Assistant</b><button id="gear" aria-label="Settings">⚙</button></header>
<div id="chat"><div class="m a">Give me any web task. I work in the cloud, so you can close this app and come back later: I'll keep going and your answer will be waiting here.</div></div>
<form id="f"><textarea id="t" rows="1" placeholder="What should I do?" required></textarea><button>Send</button></form>
<dialog id="d"><form method="dialog">
<label>Relay URL (your Cloudflare Worker)</label><input id="base" placeholder="https://xxx.workers.dev">
<label>App token</label><input id="key" type="password">
<label>Agent ID</label><input id="gid">
<label>Agent version</label><input id="gver" type="number" min="1">
<button style="background:#2563eb;color:#fff;border:0;border-radius:10px;padding:10px 18px">Save</button>
</form></dialog>
<script>
const $=id=>document.getElementById(id),chat=$("chat");
const DEF={gid:"e672fc92-927c-46c8-9902-3d3276a4208f",gver:"1",key:"",base:""};
const cfg=()=>({...DEF,...JSON.parse(localStorage.cfg||"{}")});
// state: [{task,id?,status:"queued"|"running"|"done"|"failed",out?}] survives closing the app
const load=()=>JSON.parse(localStorage.items||"[]"),save=i=>localStorage.items=JSON.stringify(i);
const upd=(n,p)=>{const i=load();const x=i.find(j=>j.n===n);if(x)Object.assign(x,p);save(i);render()};
const els={};
function add(txt,c){const e=document.createElement("div");e.className="m "+c;e.textContent=txt;chat.append(e);chat.scrollTop=chat.scrollHeight;return e}
function render(){chat.innerHTML="";add("Give me any web task. I work in the cloud, so you can close this app or go offline: tasks queue on your phone, run in the cloud, and the answer waits here.","a");
 for(const j of load()){add(j.task,"u");
  add(j.status==="done"?j.out:j.status==="failed"?"Task failed. Try again.":j.status==="queued"?"Queued. Will send when you're back online.":"Working in the cloud…",j.status==="done"?"a":"s")}}
$("gear").onclick=()=>{const c=cfg();$("gid").value=c.gid;$("gver").value=c.gver;$("key").value=c.key;$("base").value=c.base;$("d").showModal()};
$("d").onclose=()=>{localStorage.cfg=JSON.stringify({gid:$("gid").value.trim(),gver:$("gver").value.trim(),key:$("key").value.trim(),base:$("base").value.trim().replace(/\/$/,"")});sync()};
async function api(path,opt={}){const c=cfg();const r=await fetch(c.base+path,{...opt,headers:{"X-App-Token":c.key,"Content-Type":"application/json"}});
 if(!r.ok)throw new Error(r.status);return r.json()}
let busy=false;
async function sync(){ if(busy||!cfg().base||!cfg().key)return; busy=true;
 try{ for(const j of load()){
   if(j.status==="queued"){try{const r=await api(`/graphs/${cfg().gid}/execute/${cfg().gver}`,{method:"POST",body:JSON.stringify({node_input:{task:j.task}})});upd(j.n,{id:r.id,status:"running"})}catch(e){if(!navigator.onLine)break}}
  }
  for(const j of load().filter(j=>j.status==="running")){
   try{const r=await api(`/graphs/${cfg().gid}/executions/${j.id}/results`);
    if(r.status==="COMPLETED")upd(j.n,{status:"done",out:(r.output||[]).map(o=>Object.values(o)[0]).join("\n\n")||"(no output)"});
    else if(["FAILED","TERMINATED"].includes(r.status))upd(j.n,{status:"failed"})}catch(e){}}
 }finally{busy=false}}
$("f").onsubmit=e=>{e.preventDefault();const task=$("t").value.trim();if(!task)return;
 if(!cfg().base||!cfg().key){$("gear").click();return}
 $("t").value="";const i=load();i.push({n:Date.now(),task,status:"queued"});save(i);render();sync()};
addEventListener("online",sync);setInterval(sync,5000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
render();sync();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
